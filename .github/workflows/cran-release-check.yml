name: CRAN release check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: true
      NOT_CRAN: "false"
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Reject development version numbers
        shell: Rscript {0}
        run: |
          version <- read.dcf("DESCRIPTION", fields = "Version")[[1]]
          stopifnot(grepl("^[0-9]+[.][0-9]+[.][0-9]+$", version))
      - name: Check release source package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "note",
            check_dir = "check"
          )
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cran-check-${{ matrix.os }}-${{ matrix.r }}
          path: check
