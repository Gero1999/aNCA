# Developer reference for export checks and their regression tests.
version: 1
checks:
  - id: standard_output_structure
    applies_to: "Selected result tables, plots, and generated R code"
    blocks_export: true
    test: "tests/testthat/test-validate_export_outputs.R"
  - id: cdisc_schema
    applies_to: "Selected PP, ADPP, and ADNCA datasets; selected custom ADPP/ADNCA groups receive structural checks with metadata limitations reported"
    blocks_export: true
    test: "tests/testthat/test-validate_export_outputs.R"
  - id: settings_structure
    applies_to: "Selected versioned settings YAML"
    blocks_export: true
    test: "tests/testthat/test-zip-utils.R"
  - id: script_structure
    applies_to: "Selected R script and input-data RDS"
    blocks_export: true
    test: "tests/testthat/test-zip-utils.R"
  - id: slides_structure
    applies_to: "Selected result-slide source and formats"
    blocks_export: true
    test: "tests/testthat/test-zip-utils.R"
  - id: pre_specs_structure
    applies_to: "Selected CDISC pre-specification workbook"
    blocks_export: true
    test: "tests/testthat/test-zip-utils.R"
  - id: session_info_structure
    applies_to: "Selected session-information record"
    blocks_export: true
    test: "tests/testthat/test-zip-utils.R"
